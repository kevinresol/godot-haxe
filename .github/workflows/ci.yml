name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Cache hxcpp
        uses: actions/cache@v4
        with:
          path: haxe/bin/**/*.o
          key: hxcpp-${{ runner.os }}-${{ runner.arch }}

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: godot-cpp/**/*.o
          key: godot-cpp-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - run: godot --version

      - name: Install Lix
        uses: lix-pm/setup-lix@master
        with:
          lix-version: 16.0.2

      - name: Install Haxe Compiiler & Libraries
        run: lix download

      - name: Setup hxcpp
        run: yes | lix run hxcpp

      - run: python -m pip install scons
      - run: scons use_hot_reload=no generate_template_get_node=no build_library=no
        working-directory: godot-cpp

      - name: Build Haxe (macOS)
        run: haxe build-mac.hxml
        working-directory: haxe
        if: runner.os == 'macOS'

      - name: Build Haxe (Linux)
        run: haxe build-linux.hxml
        working-directory: haxe
        if: runner.os == 'Linux'

      - name: Build Haxe (Windows)
        run: haxe build-win.hxml
        working-directory: haxe
        if: runner.os == 'Windows'

      - run: lipo -create -output haxe/bin/libcppia.a haxe/bin/libcppia_arm64-debug.a haxe/bin/libcppia_x86_64-debug.a
        if: runner.os == 'macOS'

      - run: scons use_hot_reload=no generate_template_get_node=no disable_exceptions=no

      - name: Build Test Project
        run: lix download && haxe cppia.hxml
        working-directory: test
      # - run: nm -g test/bin/libgdcppia.linux.template_debug.x86_64.so
      # - run: ldd test/bin/libgdcppia.linux.template_debug.x86_64.so

      - run: godot --headless --import test/project.godot
      - run: godot --headless --path test main.tscn
